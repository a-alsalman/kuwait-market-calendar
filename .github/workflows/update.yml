name: تحديث الرزنامة

on:
  schedule:
    # 05:10 UTC = 08:10 بتوقيت الكويت، من الأحد إلى الخميس
    - cron: '10 5 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: سحب المصادر وتحديث الصفحة
        run: python update.py

      - name: حفظ التغيير
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "تحديث البيانات — $(TZ=Asia/Kuwait date +%Y-%m-%d)"
            git push
            echo "تم دفع التحديث."
          else
            echo "لا تغيير في البيانات."
          fi
